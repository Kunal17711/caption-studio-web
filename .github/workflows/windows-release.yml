name: Build Windows app and publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v2.1.0'
        required: true
        default: 'v2.1.0'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt 'pyinstaller>=6.10,<7'
      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CaptionStudio --add-data 'static;static' --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all av --collect-all imageio_ffmpeg --collect-all webview --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on --hidden-import multipart --hidden-import python_multipart desktop.py
          if (!(Test-Path 'dist/CaptionStudio/CaptionStudio.exe')) { throw 'EXE missing' }
          Compress-Archive -Path 'dist/CaptionStudio' -DestinationPath 'CaptionStudio-Windows.zip' -CompressionLevel Optimal
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptionStudio-Windows
          path: CaptionStudio-Windows.zip
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Version must look like v2.1.0' }
          gh release create "$env:VERSION" 'CaptionStudio-Windows.zip' --target "$env:GITHUB_SHA" --title "Caption Studio $env:VERSION" --notes "Free open-source Windows desktop build. Extract the entire ZIP and launch CaptionStudio.exe. The first AI model run requires a download. Unsigned application; may trigger SmartScreen."
